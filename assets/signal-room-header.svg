<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Amith Sandesh — Signal Room</title>
  <desc id="desc">A forensic-style cybersecurity header with an evidence trace and current focus labels.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1f2928" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="#080b0c"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#293431" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="372" rx="10" fill="url(#grid)" stroke="#1c2523"/>

  <g fill="#89938f" font-family="monospace" font-size="12" letter-spacing="2">
    <text x="50" y="58">EVIDENCE PLANE / 01</text>
    <text x="958" y="58">COLOMBO / LK</text>
    <text x="50" y="375">OBSERVE</text>
    <text x="556" y="375">CORRELATE</text>
    <text x="1060" y="375">VERIFY</text>
  </g>

  <g transform="translate(50 104)">
    <rect width="8" height="104" fill="#b8ff3d"/>
    <text x="30" y="58" fill="#eef0e8" font-family="Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-3">AMITH SANDESH</text>
    <text x="34" y="92" fill="#b8ff3d" font-family="monospace" font-size="16" letter-spacing="4">CYBERSECURITY ENGINEER IN PROGRESS</text>
  </g>

  <g font-family="monospace" font-size="13">
    <rect x="754" y="228" width="390" height="80" rx="5" fill="#0d1313" stroke="#33413d"/>
    <text x="778" y="253" fill="#89938f">CURRENT VECTOR</text>
    <text x="778" y="280" fill="#eef0e8" font-size="18">SOC LABS + THREAT DETECTION</text>
    <circle cx="1117" cy="253" r="5" fill="#b8ff3d" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke-linejoin="round">
    <path d="M50 326H173l24-19 30 40 34-61 28 40h72l22-13 21 13h91l24-46 27 46h80l18-18 20 18h65l24-63 29 63h126" stroke="#25312e" stroke-width="8" opacity=".75"/>
    <path d="M50 326H173l24-19 30 40 34-61 28 40h72l22-13 21 13h91l24-46 27 46h80l18-18 20 18h65l24-63 29 63h126" stroke="#b8ff3d" stroke-width="2" stroke-dasharray="7 8">
      <animate attributeName="stroke-dashoffset" values="0;-30" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="519" cy="280" r="6" fill="#4de8f5" stroke="#080b0c" stroke-width="3"/>
    <circle cx="907" cy="263" r="6" fill="#ff654d" stroke="#080b0c" stroke-width="3"/>
  </g>
</svg>
